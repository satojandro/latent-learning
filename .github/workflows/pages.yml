name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        # index.html is written without <!doctype>/<head> because it is also
        # published as a claude.ai Artifact, which adds that skeleton. Add it here.
        run: |
          mkdir -p _site
          python3 - <<'PY'
          body = open('index.html', encoding='utf-8').read()
          head = """<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <style>
          :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
          img{max-width:100%}
          [hidden]{display:none!important}
          </style>
          </head>
          <body>
          """
          head = "\n".join(line[10:] if line.startswith("          ") else line for line in head.splitlines()) + "\n"
          open('_site/index.html', 'w', encoding='utf-8').write(head + body + "\n</body>\n</html>\n")
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
